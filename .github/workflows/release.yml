name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # CI generates + commits Cargo.lock so --locked below has something to lock against.
  lockfile:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo generate-lockfile
      - id: commit
        run: |
          set -e
          NEW_SHA="${{ github.sha }}"
          if ! git diff --quiet -- Cargo.lock; then
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add Cargo.lock
              git commit -m "chore: update Cargo.lock [skip ci]"
              git push
              NEW_SHA="$(git rev-parse HEAD)"
            fi
          fi
          echo "sha=$NEW_SHA" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.lockfile.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libopus-dev cmake
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo test --all-features --locked

  lint:
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.lockfile.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libopus-dev cmake
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  audit:
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.lockfile.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: audit
      # Plain CLI, not a check-annotation action — needs no extra permissions.
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  build:
    runs-on: ubuntu-latest
    needs: [lockfile, test, lint, audit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.lockfile.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libopus-dev cmake
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo build --release --locked
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyxeebot-linux-x86_64
          path: target/release/pyxeebot
          retention-days: 14
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/pyxeebot

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: pyxeebot-linux-x86_64
          path: dist

      # Renamed pre-upload, not post: avoids ETXTBSY on the live binary; remote script does the atomic mv.
      - name: Prepare artifact for atomic swap
        run: mv dist/pyxeebot dist/pyxeebot.new

      - name: Upload binary to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "dist/pyxeebot.new"
          target: "/home/ubuntu/pyxeebotr"
          strip_components: 1
          overwrite: true

      - name: Swap binary and restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd ~/pyxeebotr
            chmod +x pyxeebot.new
            mv pyxeebot pyxeebot.prev 2>/dev/null || true
            mv pyxeebot.new pyxeebot

            sudo systemctl reset-failed pyxeebotr
            sudo systemctl restart pyxeebotr

            for i in 1 2 3 4 5; do
              sleep 3
              systemctl is-active --quiet pyxeebotr && break
              if [ $i -eq 5 ]; then
                echo "pyxeebotr failed to come up — rolling back to previous binary"
                journalctl -u pyxeebotr -n 30 --no-pager
                if [ -f pyxeebot.prev ]; then
                  mv pyxeebot.prev pyxeebot
                  sudo systemctl reset-failed pyxeebotr
                  sudo systemctl restart pyxeebotr
                  sleep 3
                  systemctl is-active --quiet pyxeebotr \
                    && echo "rollback succeeded — previous binary is running" \
                    || echo "ROLLBACK ALSO FAILED — service is down, manual intervention required"
                fi
                exit 1
              fi
            done

            rm -f pyxeebot.prev
            echo "Deployed: ${{ github.sha }}"
