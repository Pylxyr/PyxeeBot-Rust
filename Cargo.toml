[package]
name        = "pyxeebot"
version     = "0.1.0"
edition     = "2021"
description = "PyxeeBot — Discord music bot"
license     = "MIT"

[lib]
name = "pyxeebot"
path = "src/lib.rs"

[[bin]]
name = "pyxeebot"
path = "src/main.rs"

[dependencies]
# Discord
serenity  = { version = "0.12.5", default-features = false, features = [
    "builder", "cache", "client", "collector", "gateway", "model", "rustls_backend",
] }
poise     = "0.6.2"
songbird  = { version = "0.6.0", default-features = false, features = [
    "serenity", "driver", "gateway", "rustls", "tungstenite",
] }

# Async
tokio = { version = "1.53.1", features = ["full"] }

# Database
sqlx = { version = "0.9.0", features = [
    "sqlite", "runtime-tokio", "macros", "migrate",
] }

# Serialisation
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Pinned to songbird 0.6.0's own reqwest major version — different majors are distinct types.
reqwest = { version = "0.12", default-features = false, features = [
    "json", "rustls-tls",
] }

# Config
dotenvy = "0.15.7"

# Error handling
anyhow    = "1.0.104"
thiserror = "2.0.20"

# Logging
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender   = "0.2.5"

# Songbird alone requests zero Symphonia codecs — needed explicitly for WebM opus + m4a/aac fallback.
symphonia = { version = "0.5.5", features = ["isomp4", "aac"] }

# Concurrency / caching
dashmap = "6.2.1"
moka    = { version = "0.12.15", features = ["future", "sync"] }

rand      = "0.10"

# Required by songbird's own EventHandler trait
async-trait = "0.1"

# Forces the resolver past RUSTSEC-2026-0204 (crossbeam-epoch pulled in transitively by dashmap/moka).
crossbeam-epoch = "0.9.20"

[profile.release]
opt-level      = 3
lto            = "thin"
codegen-units  = 1
strip          = "symbols"
